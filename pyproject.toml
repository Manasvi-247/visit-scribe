[project]
name = "visit-scribe"
version = "0.1.0"
description = "Turn a recorded doctor visit into a summary and a medicine schedule."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
